<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Propuesta 1: cartón 5x5 con las casillas verdes formando una "N" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2640"/>
      <stop offset="1" stop-color="#101823"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#F2B705" stroke-width="14"/>
  <g transform="translate(80 80)">
    <!-- columna 1 -->
    <rect x="0"   y="0"   width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="0"   y="72"  width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="0"   y="144" width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="0"   y="216" width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="0"   y="288" width="64" height="64" rx="16" fill="#2ECC71"/>
    <!-- columna 2 -->
    <rect x="72"  y="0"   width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="72"  y="72"  width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="72"  y="144" width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="72"  y="216" width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="72"  y="288" width="64" height="64" rx="16" fill="#1F2C47"/>
    <!-- columna 3 (centro dorado, como la casilla del ID) -->
    <rect x="144" y="0"   width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="144" y="72"  width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="144" y="144" width="64" height="64" rx="16" fill="#F2B705"/>
    <rect x="144" y="216" width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="144" y="288" width="64" height="64" rx="16" fill="#1F2C47"/>
    <!-- columna 4 -->
    <rect x="216" y="0"   width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="216" y="72"  width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="216" y="144" width="64" height="64" rx="16" fill="#1F2C47"/>
    <rect x="216" y="216" width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="216" y="288" width="64" height="64" rx="16" fill="#1F2C47"/>
    <!-- columna 5 -->
    <rect x="288" y="0"   width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="288" y="72"  width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="288" y="144" width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="288" y="216" width="64" height="64" rx="16" fill="#2ECC71"/>
    <rect x="288" y="288" width="64" height="64" rx="16" fill="#2ECC71"/>
  </g>
</svg>
