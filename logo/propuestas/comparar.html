<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Propuestas de logo</title>
<style>
  body { margin: 0; background: #0B111A; color: #F3F5F9; font-family: Segoe UI, Roboto, sans-serif; }
  .wrap { display: flex; gap: 28px; padding: 28px; }
  .col { flex: 1; background: #18233A; border-radius: 18px; padding: 20px; text-align: center; }
  h2 { color: #F2B705; font-size: 18px; margin: 0 0 14px; }
  .big { width: 300px; height: 300px; }
  .sizes { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin-top: 18px; }
  .sizes div { font-size: 11px; color: #8C9AB4; }
  .light { background: #F3F5F9; border-radius: 12px; padding: 10px; margin-top: 14px; display: inline-flex; gap: 14px; align-items: center; }
</style></head><body>
<div class="wrap">
  <div class="col"><h2>1 · Rejilla "N"</h2>
    <img class="big" src="1-rejilla-n.svg">
    <div class="sizes"><div><img src="1-rejilla-n.svg" width="96"><br>96</div><div><img src="1-rejilla-n.svg" width="48"><br>48</div><div><img src="1-rejilla-n.svg" width="32"><br>32</div><div><img src="1-rejilla-n.svg" width="16"><br>16</div></div>
    <div class="light"><img src="1-rejilla-n.svg" width="48"><img src="1-rejilla-n.svg" width="32"></div>
  </div>
  <div class="col"><h2>2 · Balota conectada</h2>
    <img class="big" src="2-balota-conectada.svg">
    <div class="sizes"><div><img src="2-balota-conectada.svg" width="96"><br>96</div><div><img src="2-balota-conectada.svg" width="48"><br>48</div><div><img src="2-balota-conectada.svg" width="32"><br>32</div><div><img src="2-balota-conectada.svg" width="16"><br>16</div></div>
    <div class="light"><img src="2-balota-conectada.svg" width="48"><img src="2-balota-conectada.svg" width="32"></div>
  </div>
  <div class="col"><h2>3 · Balota con ondas</h2>
    <img class="big" src="3-balota-ondas.svg">
    <div class="sizes"><div><img src="3-balota-ondas.svg" width="96"><br>96</div><div><img src="3-balota-ondas.svg" width="48"><br>48</div><div><img src="3-balota-ondas.svg" width="32"><br>32</div><div><img src="3-balota-ondas.svg" width="16"><br>16</div></div>
    <div class="light"><img src="3-balota-ondas.svg" width="48"><img src="3-balota-ondas.svg" width="32"></div>
  </div>
</div>
</body></html>
