<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Propuesta 2: balota de bingo con una "N" hecha de nodos conectados (Nexo) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2640"/>
      <stop offset="1" stop-color="#101823"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E9EDF4"/>
      <stop offset="1" stop-color="#B9C2D3"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#4FE08E"/>
      <stop offset="1" stop-color="#1FA85A"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- cuerpo de la balota -->
  <circle cx="256" cy="256" r="196" fill="url(#ball)"/>
  <!-- círculo de color central, como en las balotas reales -->
  <circle cx="256" cy="256" r="128" fill="url(#core)"/>
  <circle cx="256" cy="256" r="128" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <!-- la "N": líneas que unen cuatro nodos -->
  <path d="M206 316 V196 L306 316 V196" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="206" cy="316" r="22" fill="#F2B705" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="206" cy="196" r="22" fill="#F2B705" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="306" cy="316" r="22" fill="#F2B705" stroke="#FFFFFF" stroke-width="8"/>
  <circle cx="306" cy="196" r="22" fill="#F2B705" stroke="#FFFFFF" stroke-width="8"/>
  <!-- brillo -->
  <ellipse cx="190" cy="120" rx="58" ry="26" fill="#FFFFFF" opacity="0.7" transform="rotate(-28 190 120)"/>
</svg>
